[project]
name = "youtube-knowledge"
version = "0.1.0"
description = "YouTube channel ingestion and transcript RAG knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "chromadb>=1.5.9",
    "fastapi>=0.136.1",
    "google-api-python-client>=2.196.0",
    "google-genai>=2.4.0",
    "httpx>=0.28.1",
    "langchain>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.37.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
    "sentence-transformers>=5.5.0",
    "uvicorn>=0.47.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
youtube-knowledge = "youtube_knowledge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
